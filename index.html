<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0d1b3e;color:#fff;font-family:system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;
  padding:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation
}
h1{font-size:22px;margin:10px 0;color:#64b5f6}
#info{display:flex;gap:20px;align-items:center;margin-bottom:8px;font-size:14px}
#levelBadge{background:#1565c0;padding:4px 14px;border-radius:12px;font-weight:700}
canvas{border-radius:12px;background:#0a1228;max-width:100%}
#slots{display:flex;gap:8px;margin:8px 0}
.slot{
  width:44px;height:36px;border-radius:8px;background:#0a1228;border:2px solid #1e3a5f;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px
}
.slot.filled{border-color:#42a5f5;background:#111d38}
#supply{display:flex;gap:10px;margin:6px 0;flex-wrap:wrap;justify-content:center}
.capsule{
  width:48px;height:60px;border-radius:14px 14px 18px 18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-weight:800;font-size:14px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.5)
}
.capsule::after{content:'';position:absolute;top:3px;left:8px;right:8px;height:10px;background:rgba(255,255,255,.25);border-radius:8px}
.capsule .cnt{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;border:1px solid rgba(255,255,255,.2)}
.capsule.empty{opacity:.2;pointer-events:none}
#btns{display:flex;gap:10px;margin:8px 0}
.btn{
  width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.2);
  background:radial-gradient(circle at 30% 25%,#64b5f6,#1565c0);
  cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #0d47a1
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0d47a1}
#msg{text-align:center;font-size:13px;color:#90caf9;min-height:20px;margin:4px 0}
</style>
</head>
<body>
<h1>🐰 PIXEL FLOW</h1>
<div id="info">
  <span id="levelBadge">Level 1</span>
  <span>🪙 <span id="coins">0</span></span>
  <span>🎯 <span id="remaining">0</span></span>
</div>
<canvas id="c"></canvas>
<div id="slots"></div>
<div id="supply"></div>
<div id="btns">
  <button class="btn" onclick="undo()">↩</button>
  <button class="btn" onclick="reset()">🔄</button>
</div>
<div id="msg"></div>

<script>
const P=['#f06292','#66bb6a','#42a5f5','#ffa726','#ab47bc','#fff176','#4dd0e1','#ef5350'];
const BG='#0a1228';
const BM=5;
let levels=[],state={lv:0,grid:[],supply:[],belt:[],slots:[null,null,null,null,null],coins:0,completed:{},hist:[],clock:0,CELL:0};

// Generate levels
for(let i=0;i<120;i++){
  let sz=i<8?5:i<18?6:i<35?7:i<60?8:i<85?9:10;
  let nc=i<6?2:i<15?3:i<30?4:i<55?5:6;
  let p=Array.from({length:sz},()=>Array(sz).fill(-1));
  let cl=shuffle([...Array(8).keys()]).slice(0,nc);
  cl.forEach(ci=>{
    let blob=4+rnd(sz*sz/nc);
    let r=rnd(sz),c=rnd(sz);
    for(let b=0;b<blob;b++){
      if(p[r][c]===-1)p[r][c]=ci;
      let d=[[0,1],[0,-1],[1,0],[-1,0]][rnd(4)];
      let nr=r+d[0],nc=c+d[1];if(nr>=0&&nr<sz&&nc>=0&&nc<sz){r=nr;c=nc}
    }
  });
  let su=[];cl.forEach(ci=>{let n=0;p.forEach(r=>r.forEach(v=>{if(v===ci)n++}));su.push({c:ci,a:n+2+rnd(4)});});
  levels.push({sz,p,su,cl});
}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}

// Load
try{let c=localStorage.getItem('pf9c');if(c)state.completed=JSON.parse(c);let n=localStorage.getItem('pf9n');if(n)state.coins=parseInt(n)}catch(e){}
function save(){try{localStorage.setItem('pf9c',JSON.stringify(state.completed));localStorage.setItem('pf9n',''+state.coins)}catch(e){}}

function start(n){
  state.lv=n;state.hist=[];state.clock=0;
  let l=levels[n],sz=l.sz;
  state.CELL=Math.floor((Math.min(window.innerWidth-32,380))/sz);
  let cv=document.getElementById('c');
  cv.width=sz*state.CELL+80;cv.height=sz*state.CELL+80;
  state.grid=l.p.map(r=>[...r]);state.belt=[];state.slots=[null,null,null,null,null];
  state.supply=l.su.map(s=>({c:s.c,a:s.a}));
  render();requestAnimationFrame(loop);
}

let raf;
function loop(){
  let l=levels[state.lv],sz=l.sz;
  state.clock+=.01;if(state.clock>1)state.clock-=1;
  // Belt bunnies auto-shoot
  state.belt.forEach(b=>{
    b.cd=Math.max(0,b.cd-16);
    if(b.a>0&&b.cd<=0){
      let best=null,bA=1e9,bAng=b.pos*Math.PI*2+state.clock*Math.PI*2;
      for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(state.grid[r][c]===b.c){
        let ta=Math.atan2(r-sz/2+.5,c-sz/2+.5);
        let df=Math.abs(((bAng-ta+Math.PI*3)%(Math.PI*2))-Math.PI);
        if(df<bA&&df<.5){bA=df;best={r,c};}
      }
      if(best){state.grid[best.r][best.c]=-1;b.a--;b.cd=300;b.hit=best;}
    }
  });
  // Remove dead, move to slots
  for(let i=state.belt.length-1;i>=0;i--){
    let b=state.belt[i];
    if(b.a<=0){state.belt.splice(i,1);continue}
    if(b.pos>.9){let si=state.slots.indexOf(null);if(si!==-1){let b2=state.belt.splice(i,1)[0];state.slots[si]={c:b2.c,a:b2.a};}}
  }
  draw();render();
  if(checkWin()){save();msg('🎉 Level '+(state.lv+1)+' geschafft! +10 🪙');return;}
  raf=requestAnimationFrame(loop);
}

function draw(){
  let l=levels[state.lv],sz=l.sz,cv=document.getElementById('c');
  let ctx=cv.getContext('2d'),C=state.CELL;
  let ox=(cv.width-sz*C)/2,oy=(cv.height-sz*C)/2;
  ctx.clearRect(0,0,cv.width,cv.height);
  let cx=ox+sz*C/2,cy=oy+sz*C/2,bR=sz*C/2+20;
  
  // Belt ring
  ctx.strokeStyle='#1e3a5f';ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(cx,cy,bR,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#42a5f5';ctx.lineWidth=2;
  ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(cx,cy,bR,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  
  // Grid cells
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){
    let x=ox+c*C,y=oy+r*C,v=state.grid[r][c];
    if(v>=0){ctx.fillStyle=P[v];ctx.fillRect(x+1,y+1,C-2,C-2);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+1,y+1,C-2,3);}
    else ctx.fillStyle=BG,ctx.fillRect(x+1,y+1,C-2,C-2);
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=.5;ctx.strokeRect(x,y,C,C);
  }
  
  // Bunnies on belt
  state.belt.forEach(b=>{
    let ang=b.pos*Math.PI*2+state.clock*Math.PI*2;
    let bx=cx+Math.cos(ang)*bR,by=cy+Math.sin(ang)*bR;
    // Body
    ctx.fillStyle=P[b.c];ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(bx-1,by-2,3,0,Math.PI*2);ctx.fill();
    // Ears
    ctx.fillStyle=P[b.c];ctx.fillRect(bx-3,by-12,3,8);ctx.fillRect(bx+1,by-12,3,8);
    ctx.fillStyle='#ffb6c1';ctx.fillRect(bx-2,by-10,1.5,4);ctx.fillRect(bx+2,by-10,1.5,4);
    // Eyes
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx-2,by-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx+3,by-1,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bx-1.5,by-1,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx+3.5,by-1,1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff69b4';ctx.beginPath();ctx.arc(bx,by+2,1.5,0,Math.PI*2);ctx.fill();
    // Ammo
    ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(bx-10,by-22,20,13,6);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(b.a,bx,by-12);
    // Hit effect
    if(b.hit&&b.cd>200){
      let tx=ox+b.hit.c*C+C/2,ty=oy+b.hit.r*C+C/2;
      ctx.strokeStyle=P[b.c]+'80';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillRect(tx-2,ty-2,4,4);
    }
  });
}

// Reattach slot+supply events after render
function reAttach(){
  document.querySelectorAll('#slots .slot').forEach(function(el,i){
    el.onclick=function(){slotTap(i);};
  });
  document.querySelectorAll('#supply .capsule').forEach(function(el,i){
    el.onclick=function(){supplyTap(i);};
  });
}
function render(){
  document.getElementById('levelBadge').textContent='Level '+(state.lv+1);
  document.getElementById('coins').textContent=state.coins;
  let rem=0;state.grid.forEach(r=>r.forEach(v=>{if(v>=0)rem++}));
  document.getElementById('remaining').textContent=rem;
  
  // Clear old events
  let sr=document.getElementById('slots');
  sr.replaceChildren();
  state.slots.forEach(function(s,i){
    if(s)return`<div class="slot filled" style="background:${P[s.c]};color:${P[s.c]}" onclick="slotTap(${i})">🐰</div>`;
    return`<div class="slot" onclick="slotTap(${i})" style="color:#1e3a5f">+</div>`;
  }).join('');
  
  // Supply
  let su=document.getElementById('supply');
  su.replaceChildren();
  state.supply.forEach(function(s,i){
    var el=document.createElement('div');
    el.className='capsule'+(s.a<=0?' empty':'');
    el.style.background=P[s.c];
    el.innerHTML='<div class="cnt">'+s.a+'</div>🐰';
    el.onclick=function(){supplyTap(i);};
    su.appendChild(el);
  });
  reAttach();
}

function supplyTap(i){
  let s=state.supply[i];if(!s||s.a<=0)return;
  if(state.belt.length>=BM){msg('🛑 Band voll!');return}
  s.a--;state.belt.push({c:s.c,a:s.a>0?s.a:1,pos:.05+rnd(10)/100,cd:0});
  if(s.a<=0)state.supply.splice(i,1);
  saveHist();render();
}
function slotTap(i){
  let s=state.slots[i];if(!s)return;
  if(state.belt.length>=BM){msg('🛑 Band voll!');return}
  state.belt.push({c:s.c,a:s.a,pos:.05+rnd(10)/100,cd:0});state.slots[i]=null;
  saveHist();render();
}

// Tap canvas anywhere = send from supply
document.getElementById('c').addEventListener('click',function(){
  let av=state.supply.findIndex(function(s){return s.a>0;});
  if(av!==-1){supplyTap(av);return;}
  let sl=state.slots.findIndex(function(s){return s!==null;});
  if(sl!==-1){slotTap(sl);}
});

function saveHist(){
  state.hist.push({g:state.grid.map(r=>[...r]),b:JSON.parse(JSON.stringify(state.belt)),sl:[...state.slots],su:JSON.parse(JSON.stringify(state.supply))});
  if(state.hist.length>20)state.hist.shift();
}
function undo(){if(!state.hist.length)return;let p=state.hist.pop();state.grid=p.g;state.belt=p.b;state.slots=p.sl;state.supply=p.su;render();msg('↩ Rückgängig');}
function reset(){
  state.hist=[];let l=levels[state.lv];state.grid=l.p.map(r=>[...r]);state.belt=[];state.slots=[null,null,null,null,null];
  state.supply=l.su.map(s=>({c:s.c,a:s.a}));render();msg('🔄 Zurückgesetzt');
}
function checkWin(){
  if(state.belt.some(b=>b.a>0))return false;
  if(state.slots.some(s=>s&&s.a>0))return false;
  for(let r of state.grid)for(let v of r)if(v>=0)return false;
  state.completed[state.lv]=true;state.coins+=10;save();
  cancelAnimationFrame(raf);
  let n=state.lv+1;if(n>=120)return msg('🏆 Alle Level!'),true;
  setTimeout(()=>start(n),1500);
  return true;
}
function msg(t){document.getElementById('msg').textContent=t;setTimeout(()=>document.getElementById('msg').textContent='',2000);}

// Start
start(0);
</script>
</body>
</html>
