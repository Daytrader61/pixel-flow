<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0d1b3e;color:#fff;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
main{max-width:420px;margin:0 auto;padding:8px}

#menu{text-align:center}
#menu h1{font-size:24px;margin:16px 0;color:#42a5f5}
.lvs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.lv{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#42a5f5,#1565c0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 0 #0d47a1}
.lv:active{transform:scale(.82)}
.lv.dn{background:linear-gradient(135deg,#66bb6a,#388e3c)}
.lv.lk{background:#2a2a3a;opacity:.35;pointer-events:none}
.pl{display:block;width:100%;padding:14px;margin:10px 0;background:linear-gradient(180deg,#fff176,#f9a825);color:#111;font-weight:900;font-size:18px;border-radius:40px;cursor:pointer;border:3px solid #000;box-shadow:0 4px 0 #c49000;text-align:center}

#game{display:none}
.tb{display:flex;justify-content:space-between;align-items:center;padding:4px 0;margin-bottom:6px}
.tb .ic{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#42a5f5,#1565c0);border:2px solid rgba(255,255,255,.15);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0d47a1}
.tb .tg{background:#1565c0;padding:5px 14px;border-radius:14px;font-weight:700;font-size:12px}
.tb .cn{color:#ffd700;font-weight:700;font-size:13px}
canvas{display:block;max-width:100%;border-radius:12px;margin:0 auto;background:#0a1228}
.hint{text-align:center;color:#90caf9;font-size:12px;padding:6px 0;min-height:28px}

.slots{display:flex;gap:10px;justify-content:center;padding:8px 0}
.slt{width:52px;height:44px;border-radius:10px;border:2px solid #1e3a5f;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;background:#0a1228;transition:all .1s}.slt:active{transform:scale(.9);background:#152040}
.slt.ok{border-color:#42a5f5;background:#111d38}

.supply{display:flex;gap:16px;justify-content:center;padding:6px 0;flex-wrap:wrap}
.cp{width:58px;height:72px;border-radius:16px 16px 22px 22px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.5);transition:all .1s;border:3px solid rgba(255,255,255,.12)}
.cp:active{transform:scale(.88);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.cp::after{content:'';position:absolute;top:4px;left:10px;right:10px;height:14px;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:10px}
.cp .lb{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.2)}
.cp.dn{opacity:.15;pointer-events:none}
.cp>*{pointer-events:none}

.btm{display:flex;gap:12px;justify-content:center;padding:8px 0}
.bt{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:radial-gradient(circle at 30% 25%,#64b5f6,#1565c0);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #0d47a1}
.bt:active{transform:translateY(2px)}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 20px;background:rgba(0,0,0,.85);color:#fff;border-radius:16px;font-size:13px;font-weight:700;z-index:999;pointer-events:none;opacity:0;transition:.2s}#toast.s{opacity:1}
</style>
</head>
<body>

<main>
<div id="menu">
  <h1>🐰 PIXEL FLOW</h1>
  <div class="lvs" id="lvs"></div>
  <div class="pl" id="plBtn">▶ SPIELEN</div>
</div>

<div id="game">
  <div class="tb">
    <div class="ic" id="backBtn">◀</div>
    <div class="tg" id="lvTag">Level 1</div>
    <div class="cn">🪙 <span id="cnDisp">0</span></div>
  </div>
  <canvas id="c"></canvas>
  <div class="hint" id="hint">👆 Tippe auf eine Farbe um sie ins Förderband zu laden</div>
  <div class="slots" id="slots"></div>
  <div class="supply" id="supply"></div>
  <div class="btm">
    <div class="bt" id="undoBtn">↩</div>
    <div class="bt" id="resetBtn">🔄</div>
  </div>
</div>
</main>
<div id="toast"></div>

<script>
const P=['#f06292','#66bb6a','#42a5f5','#ffa726','#ab47bc','#fff176','#4dd0e1','#ef5350'],BM=5;
let LV=[];(function(){
  for(let i=0;i<100;i++){
    let sz=i<10?5:i<25?6:i<45?7:i<70?8:9;
    let nc=Math.min(2+Math.floor(i/15),6);
    let p=Array.from({length:sz},()=>Array(sz).fill(-1));
    let cl=shuf([...Array(8).keys()]).slice(0,nc);
    cl.forEach(ci=>{
      let blob=5+Math.floor(Math.random()*sz*sz/nc);
      let r=rnd(sz),c=rnd(sz);
      for(let b=0;b<blob;b++){if(p[r][c]===-1)p[r][c]=ci;let d=[[0,1],[0,-1],[1,0],[-1,0]][rnd(4)];let nr=r+d[0],nc=c+d[1];if(nr>=0&&nr<sz&&nc>=0&&nc<sz){r=nr;c=nc}}
    });
    let sp=[];cl.forEach(ci=>{let nd=0;p.forEach(r=>r.forEach(v=>{if(v===ci)nd++}));sp.push({c:ci,a:nd+2+rnd(4)});});LV.push({sz,p,sp,cl});
  }
  function rnd(n){return Math.floor(Math.random()*n)}
  function shuf(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
})();

let S={lv:0,g:[],sp:[],b:[],sl:[null,null,null,null,null],cn:0,cm:{},hi:[],ck:0,CL:0,raf:null};
try{let c=localStorage.getItem('pf10c');if(c)S.cm=JSON.parse(c);S.cn=parseInt(localStorage.getItem('pf10n'))||0}catch(e){}
function sv(){try{localStorage.setItem('pf10c',JSON.stringify(S.cm));localStorage.setItem('pf10n',''+S.cn)}catch(e){}}

function buildMenu(){
  document.getElementById('lvs').innerHTML=Array.from({length:30},(_,i)=>{
    let cls=S.cm[i]?'dn':(i>0&&!S.cm[i-1]?'lk':'');
    return`<div class="lv ${cls}" data-i="${i}">${i+1}</div>`;
  }).join('');
  document.querySelectorAll('.lv:not(.lk)').forEach(el=>{el.onpointerdown=function(e){e.preventDefault();start(parseInt(this.dataset.i));};});
  document.getElementById('plBtn').onpointerdown=function(e){e.preventDefault();let l=0;for(let i=99;i>=0;i--){if(S.cm[i]){l=Math.min(i+1,99);break}}start(l);};
}
function goMenu(){cancelAnimationFrame(S.raf);S.raf=null;document.getElementById('menu').style.display='';document.getElementById('game').style.display='none';buildMenu();}
document.getElementById('backBtn').onpointerdown=function(e){e.preventDefault();goMenu();};

function start(n){
  S.lv=n;S.hi=[];S.ck=0;let l=LV[n],sz=l.sz;
  S.CL=Math.floor((Math.min(window.innerWidth-24,400)-80)/sz);
  let cv=document.getElementById('c');cv.width=cv.height=sz*S.CL+80;
  S.g=l.p.map(r=>[...r]);S.b=[];S.sl=[null,null,null,null,null];S.sp=l.sp.map(s=>({c:s.c,a:s.a}));
  document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';
  render();S.raf=requestAnimationFrame(loop);
  ts('Level '+(n+1));
}

function loop(){
  let sz=LV[S.lv].sz;S.ck+=.01;if(S.ck>1)S.ck-=1;
  S.b.forEach(b=>{b.cd=Math.max(0,b.cd-16);if(b.a>0&&b.cd<=0){let bs=null,ba=1e9,bg=b.pos*Math.PI*2+S.ck*Math.PI*2;
    for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(S.g[r][c]===b.c){let ta=Math.atan2(r-sz/2+.5,c-sz/2+.5),df=Math.abs(((bg-ta+Math.PI*3)%(Math.PI*2))-Math.PI);if(df<ba&&df<.45){ba=df;bs={r,c};}}
    if(bs&&ba<.35){S.g[bs.r][bs.c]=-1;b.a--;b.cd=250;b.ht=bs;}
  }});
  for(let i=S.b.length-1;i>=0;i--){let b=S.b[i];if(b.a<=0){S.b.splice(i,1);continue}if(b.pos>.9){let si=S.sl.indexOf(null);if(si!==-1){S.sl[si]=S.b.splice(i,1)[0];}}}
  draw();render();if(cw())return;S.raf=requestAnimationFrame(loop);
}

function draw(){
  let l=LV[S.lv],sz=l.sz,cv=document.getElementById('c'),ctx=cv.getContext('2d'),C=S.CL;
  let ox=(cv.width-sz*C)/2,oy=(cv.height-sz*C)/2,cx=cv.width/2,cy=cv.height/2,bR=sz*C/2+18;
  ctx.clearRect(0,0,cv.width,cv.height);
  // Belt
  ctx.beginPath();ctx.arc(cx,cy,bR+6,0,Math.PI*2);ctx.fillStyle='rgba(5,10,25,.7)';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,bR+5,0,Math.PI*2);ctx.strokeStyle='#1e3a5f';ctx.lineWidth=6;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,bR-2,0,Math.PI*2);ctx.strokeStyle='rgba(66,165,245,.5)';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
  // Grid
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){let x=ox+c*C,y=oy+r*C,v=S.g[r][c];
    if(v>=0){ctx.fillStyle=P[v];ctx.fillRect(x+1,y+1,C-2,C-2);ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x+1,y+1,C-2,3);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x+1,y+C-4,C-2,3);}
    else{ctx.fillStyle='#0a1228';ctx.fillRect(x+1,y+1,C-2,C-2);}
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=.5;ctx.strokeRect(x,y,C,C);
  }
  // Bunnies on belt
  S.b.forEach(b=>{let ang=b.pos*Math.PI*2+S.ck*Math.PI*2,bx=cx+Math.cos(ang)*bR,by=cy+Math.sin(ang)*bR;
    ctx.fillStyle=P[b.c];ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(bx-1,by-2,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=P[b.c];ctx.fillRect(bx-3,by-12,3,8);ctx.fillRect(bx+1,by-12,3,8);
    ctx.fillStyle='#ffb6c1';ctx.fillRect(bx-2,by-10,1.5,4);ctx.fillRect(bx+2,by-10,1.5,4);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx-2,by-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx+3,by-1,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bx-1.5,by-1,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx+3.5,by-1,1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff69b4';ctx.beginPath();ctx.arc(bx,by+2,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.roundRect(bx-10,by-22,20,14,6);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(b.a,bx,by-12);
    if(b.ht&&b.cd>180){ctx.strokeStyle=P[b.c]+'80';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ox+b.ht.c*C+C/2,oy+b.ht.r*C+C/2);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(ox+b.ht.c*C+C/2-2,oy+b.ht.r*C+C/2-2,4,4);}
  });
}

function render(){
  document.getElementById('lvTag').textContent='Level '+(S.lv+1);
  document.getElementById('cnDisp').textContent=S.cn;
  // Slots
  let sr=document.getElementById('slots');sr.innerHTML='';
  S.sl.forEach((s,i)=>{
    let el=document.createElement('div');el.className='slt'+(s?' ok':'');
    el.innerHTML=s?'🐰':'+';el.style.fontSize=s?'22px':'18px';
    el.onpointerdown=function(e){e.preventDefault();e.stopPropagation();slotTap(i);};
    sr.appendChild(el);
  });
  // Supply capsules
  let sp=document.getElementById('supply');sp.innerHTML='';
  S.sp.forEach((s,i)=>{
    let el=document.createElement('div');
    el.className='cp'+(s.a<=0?' dn':'');
    el.style.background=P[s.c];
    el.innerHTML='<div class="lb">'+s.a+'</div>🐰';
    el.onpointerdown=function(e){e.preventDefault();e.stopPropagation();supplyTap(i);};
    sp.appendChild(el);
  });
}
// Also make undo/reset use pointerdown
document.getElementById('undoBtn').onpointerdown=function(e){e.preventDefault();undo();};
document.getElementById('resetBtn').onpointerdown=function(e){e.preventDefault();resetL()};

function supplyTap(i){
  let s=S.sp[i];if(!s||s.a<=0)return;
  if(S.b.length>=BM){ts('🛑 Band voll ('+BM+')');return}
  s.a--;S.b.push({c:s.c,a:s.a>0?s.a:1,pos:.05+Math.random()*.05,cd:0,ht:null});
  if(s.a<=0)S.sp.splice(i,1);saveH();render();
  document.getElementById('hint').textContent='🐰 '+S.b.length+'/'+BM+' auf dem Band · Hasen schießen automatisch';
}
function slotTap(i){let s=S.sl[i];if(!s)return;if(S.b.length>=BM){ts('🛑 Band voll!');return}S.b.push({c:s.c,a:s.a,pos:.05+Math.random()*.05,cd:0,ht:null});S.sl[i]=null;saveH();render();}
function saveH(){S.hi.push({g:S.g.map(r=>[...r]),b:JSON.parse(JSON.stringify(S.b)),sl:[...S.sl],sp:JSON.parse(JSON.stringify(S.sp))});if(S.hi.length>20)S.hi.shift();}
function undo(){if(!S.hi.length)return;let p=S.hi.pop();S.g=p.g;S.b=p.b;S.sl=p.sl;S.sp=p.sp;render();}
function resetL(){S.hi=[];let l=LV[S.lv];S.g=l.p.map(r=>[...r]);S.b=[];S.sl=[null,null,null,null,null];S.sp=l.sp.map(s=>({c:s.c,a:s.a}));render();document.getElementById('hint').textContent='👆 Tippe auf eine Farbe';}
function cw(){
  for(let r of S.g)for(let v of r)if(v>=0)return false;
  S.cm[S.lv]=true;S.cn+=10;sv();cancelAnimationFrame(S.raf);
  setTimeout(()=>{let n=S.lv+1;if(n>=100){goMenu();ts('🏆 Alle Level!');return}S.cm[n]=true;sv();start(n);},1500);
  ts('🎉 +10 🪙');return true;
}
function ts(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('s');setTimeout(()=>t.classList.remove('s'),1500);}

buildMenu();
</script>
</body>
</html>
