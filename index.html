<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#060218;font-family:system-ui;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:22px;font-weight:900;margin:14px 0 6px;color:#ce93d8}
.sub{font-size:10px;color:#7e57c2;margin-bottom:10px}
.lvs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px;margin:6px 0}
.lv{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;cursor:pointer;transition:.1s}
.lv.p{background:linear-gradient(135deg,#6a1b9a,#4a148c);color:#fff}
.lv.d{background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff}
.lv.l{background:#2a2a3a;color:#555;pointer-events:none}
.lv.n{background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;animation:pl 1s infinite}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.pl{width:260px;padding:14px;margin:8px 0;background:linear-gradient(180deg,#fff176,#f9a825);color:#111;font-weight:900;font-size:17px;border-radius:40px;text-align:center;cursor:pointer;border:3px solid #000;box-shadow:0 4px 0 #c49000}
.pl:active{transform:translateY(3px)}
.cn{color:#ffd700;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="menu" style="text-align:center;padding:16px">
  <h1>PIXEL FLOW</h1>
  <div class="sub">Verbinde die Farben · Befreie das Feld</div>
  <div class="lvs" id="lvs"></div>
  <div class="pl" id="playBtn">▶ SPIELEN</div>
  <div class="cn">🪙 <span id="mcoins">0</span></div>
</div>
<div id="game" style="display:none;flex-direction:column;align-items:center;width:100%;max-width:440px;height:100vh">
  <div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 10px">
    <button style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6a1b9a,#4a148c);border:1px solid rgba(206,147,216,.3);color:#fff;font-size:16px;cursor:pointer" id="backBtn">◀</button>
    <span style="background:rgba(106,27,154,.4);padding:5px 14px;border-radius:12px;font-weight:700;font-size:11px;color:#ce93d8" id="lvTag">1</span>
    <span class="cn">🪙 <span id="gcoins">0</span></span>
  </div>
  <canvas id="cvs" style="border-radius:12px;max-width:100%"></canvas>
  <div id="hint" style="color:#7e57c2;font-size:10px;font-weight:600;padding:2px 0;min-height:20px;text-align:center">FARBE ANTIPPEN → HASE AUFS BAND</div>
  <div id="slots" style="display:flex;gap:6px;justify-content:center;padding:2px 0;min-height:44px"></div>
  <div id="capsules" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:2px 0;min-height:70px"></div>
  <div style="display:flex;gap:8px;justify-content:center;padding:4px 0">
    <button style="width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:radial-gradient(circle at 30% 25%,#64b5f6,#1565c0);color:#fff;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #0d47a1" id="undoBtn">↩</button>
    <button style="width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:radial-gradient(circle at 30% 25%,#64b5f6,#1565c0);color:#fff;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #0d47a1" id="resetBtn">↺</button>
  </div>
</div>
<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:9px 18px;background:rgba(26,13,56,.95);color:#ce93d8;border-radius:14px;font-size:12px;font-weight:700;pointer-events:none;opacity:0;transition:.2s;z-index:999;border:1px solid rgba(157,78,221,.3)"></div>

<script>
// ═══════════ DATA ═══════════
const P=['#f06292','#66bb6a','#42a5f5','#ffa726','#ab47bc','#fff176','#4dd0e1','#ef5350'];
const BM=5;
const LVS=[];(function(){
  for(let i=0;i<60;i++){
    let sz=i<6?5:i<14?6:i<26?7:i<38?8:i<50?9:10;
    let g=Array.from({length:sz},()=>Array(sz).fill(-1));
    let nc=Math.min(2+Math.floor(i/10),6),cs=[...Array(8).keys()].sort(()=>Math.random()-.5).slice(0,nc);
    if(i%5===0){for(let y=1;y<sz-1;y++)for(let x=1;x<sz-1;x++)if(x===1||x===sz-2||y===1||y===sz-2)g[y][x]=cs[0];for(let y=sz/3|0;y<sz*2/3;y++)for(let x=sz/3|0;x<sz*2/3;x++)if(nc>1&&(x+y)%2===0)g[y][x]=cs[1];}
    else if(i%5===1){let cx=sz/2|0,cy=sz/2|0;for(let a=0;a<Math.PI*2;a+=.08){for(let r=1;r<sz/3;r++){let x=cx+Math.cos(a)*r|0,y=cy+Math.sin(a)*r*.6|0;if(x>=0&&x<sz&&y>=0&&y<sz)g[y][x]=cs[0];}}if(nc>1)for(let a=0;a<Math.PI*2;a+=.08)for(let r=sz/4;r<sz/4+4;r++){let x=cx+Math.cos(a)*r|0,y=cy+Math.sin(a)*r*.3|0;if(x>=0&&x<sz&&y>=0&&y<sz)g[y][x]=cs[1];}}
    else if(i%5===2){for(let y=0;y<sz;y++)for(let x=0;x<sz;x++)g[y][x]=cs[(y%4)<2?0:(nc>1?1:0)];}
    else if(i%5===3){let c=sz/2|0;for(let j=0;j<sz;j++){g[j][c]=cs[0];g[c][j]=nc>1?cs[1]:cs[0];}if(nc>2)for(let y=1;y<sz-1;y++)for(let x=1;x<sz-1;x++)if(Math.abs(y-c)<2&&Math.abs(x-c)<2&&!(y===c||x===c))g[y][x]=cs[2];}
    else{let c=sz/2|0;for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){let d=Math.abs(y-c)+Math.abs(x-c);if(d<sz/6)g[y][x]=cs[0];else if(nc>1&&d<sz/3)g[y][x]=cs[1];else if(nc>2&&d<sz/2)g[y][x]=cs[2];}}
    let used=new Set();g.forEach(r=>r.forEach(v=>{if(v>=0)used.add(v);}));if(used.size<2)g[sz/2|0][sz/2|0]=cs[1]||0,used.add(cs[1]||0);
    let am={};used.forEach(c=>{let n=0;g.forEach(r=>r.forEach(v=>{if(v===c)n++;}));am[c]=n+2+Math.floor(Math.random()*3);});
    LVS.push({sz,g,am});
  }
})();

let S={lv:0,g:[],am:{},belt:[],sl:[null,null,null,null,null],cn:0,cm:{},hi:[],CL:0};
try{S.cm=JSON.parse(localStorage.getItem('pfz2c')||'{}');S.cn=parseInt(localStorage.getItem('pfz2n'))||0}catch(e){}
function sv(){localStorage.setItem('pfz2c',JSON.stringify(S.cm));localStorage.setItem('pfz2n',''+S.cn);}
function sh(){S.hi.push({g:S.g.map(r=>[...r]),am:{...S.am},belt:S.belt.map(b=>({c:b.c,a:b.a,p:b.p,cd:b.cd})),sl:[...S.sl]});if(S.hi.length>30)S.hi.shift();}

const $=id=>document.getElementById(id);
const E=(t,c,p)=>Object.assign(document.createElement(t),{className:c||''},p||{});

function toast(m){let t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)}

function startLv(n){
  S.lv=n;let lv=LVS[S.lv];S.g=lv.g.map(r=>[...r]);S.am={};Object.entries(lv.am).forEach(([c,v])=>S.am[c]=v);
  S.belt=[];S.sl=[null,null,null,null,null];S.hi=[];
  $('menu').style.display='none';$('game').style.display='flex';
  $('lvTag').textContent='L'+ (n+1);$('hint').textContent='FARBE ANTIPPEN → HASE AUFS BAND';
  drawAll();renderUI();
}

function goMenu(){
  cancelAnimationFrame(loopId);loopId=null;
  $('menu').style.display='block';$('game').style.display='none';
  $('mcoins').textContent=S.cn;buildMenu();
}

// ===== CANVAS =====
function drawAll(){
  let lv=LVS[S.lv],sz=lv.sz,cv=$('cvs'),W=Math.min(window.innerWidth-16,420);
  S.CL=Math.floor((W-70)/sz);let C=S.CL;
  cv.width=sz*C+70;cv.height=sz*C+70;
  let ctx=cv.getContext('2d');
  let ox=(cv.width-sz*C)/2,oy=(cv.height-sz*C)/2,cx=cv.width/2,cy=cv.height/2,bR=sz*C/2+20;
  
  // Chassis
  ctx.fillStyle='rgba(17,7,32,.9)';ctx.beginPath();ctx.roundRect(ox-12,oy-12,sz*C+24,sz*C+24,14);ctx.fill();
  ctx.fillStyle='#0a0018';ctx.beginPath();ctx.roundRect(ox-1,oy-1,sz*C+2,sz*C+2,8);ctx.fill();
  for(let i=0;i<10;i++){ctx.fillStyle='rgba(10,0,24,.8)';ctx.fillRect(ox+i*((sz*C+24)/10)+2,oy-10,3,4);}
  
  // Belt ring
  ctx.fillStyle='rgba(4,1,18,.9)';ctx.beginPath();ctx.arc(cx,cy,bR+10,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(26,13,56,1)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(cx,cy,bR+3,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(92,61,138,.5)';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(cx,cy,bR-1,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  
  // Grid
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){
    let x=ox+c*C,y=oy+r*C,v=S.g[r][c];
    ctx.fillStyle=v>=0?P[v]:'#0a0018';ctx.fillRect(x+1,y+1,C-2,C-2);
    if(v>=0){ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+1,y+1,C-2,2);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x+1,y+C-3,C-2,2);}
    ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=.5;ctx.strokeRect(x+.5,y+.5,C-1,C-1);
  }
  
  // Draw bunnies on belt
  S.belt.forEach(b=>{
    let a=b.p*Math.PI*2+tk*Math.PI*2,bx=cx+Math.cos(a)*bR,by=cy+Math.sin(a)*bR;
    ctx.fillStyle=P[b.c];ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(bx-1,by-1,3,0,Math.PI*2);ctx.fill();
    // Ammo
    ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(bx-10,by-23,20,13,6);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 9px sans';ctx.textAlign='center';ctx.fillText(b.a,bx,by-14);
    // Hit line
    if(b.ht&&b.cd>140){ctx.strokeStyle=P[b.c]+'80';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ox+b.ht.c*C+C/2,oy+b.ht.r*C+C/2);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox+b.ht.c*C+C/2,oy+b.ht.r*C+C/2,3,0,Math.PI*2);ctx.fill();}
  });
  
  // Hit flash effect
  S.belt.forEach(b=>{if(b.ht&&b.cd>180){let tx=ox+b.ht.c*C+C/2,ty=oy+b.ht.r*C+C/2;ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(tx,ty,5,0,Math.PI*2);ctx.fill();}});
}

let tk=0,loopId;
function loop(){
  tk=(tk+.014)%1;let lv=LVS[S.lv],sz=lv.sz;
  S.belt.forEach(b=>{
    b.cd=Math.max(0,b.cd-16);
    if(b.a>0&&b.cd<=0){
      let bs=null,ba=1e9,bg=b.p*Math.PI*2+tk*Math.PI*2;
      for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(S.g[r][c]===b.c){
        let ta=Math.atan2(r-sz/2+.5,c-sz/2+.5),df=Math.abs(((bg-ta+Math.PI*3)%(Math.PI*2))-Math.PI);
        if(df<ba&&df<.35){ba=df;bs={r,c};}
      }
      if(bs&&ba<.28){S.g[bs.r][bs.c]=-1;b.a--;b.cd=180;b.ht=bs;}
    }
  });
  for(let i=S.belt.length-1;i>=0;i--){let b=S.belt[i];if(b.a<=0){S.belt.splice(i,1);continue}if(b.p>.88){let si=S.sl.indexOf(null);if(si!==-1)S.sl[si]=S.belt.splice(i,1)[0];}}
  drawAll();updateUI();
  let won=true;for(let r of S.g)for(let v of r)if(v>=0){won=false;break}
  if(won){S.cm[S.lv]=true;S.cn+=10;sv();cancelAnimationFrame(loopId);$('hint').textContent='🎉 +10 🪙';setTimeout(()=>{let n=S.lv+1;if(n>=60)goMenu();else startLv(n);},1200);return}
  loopId=requestAnimationFrame(loop);
}

// ===== UI =====
function renderUI(){
  $('gcoins').textContent=S.cn;$('mcoins').textContent=S.cn;
  let nOnBelt=S.belt.length;$('hint').textContent=nOnBelt>0?'🐰 '+nOnBelt+'/'+BM+' HASEN AUF BAND':'FARBE ANTIPPEN → HASE AUFS BAND';
  
  // Slots
  let sr=$('slots');sr.innerHTML='';
  S.sl.forEach((s,i)=>{
    let el=E('div','sl');el.style.cssText='width:42px;height:36px;border-radius:8px;border:2px solid '+(s?'rgba(92,61,138,.7)':'rgba(92,61,138,.3)')+';background:'+(s?'rgba(26,13,56,.7)':'rgba(10,0,24,.6)')+';display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px';
    el.textContent=s?'🐰':'+';
    el.addEventListener('pointerdown',e=>{e.preventDefault();tapSl(i);});
    sr.appendChild(el);
  });
  
  // Capsules
  let cr=$('capsules');cr.innerHTML='';
  let aci=Object.keys(S.am).map(Number);
  aci.forEach(ci=>{
    let n=S.am[ci]||0;
    let el=E('div','cap');el.style.cssText='width:48px;height:62px;border-radius:14px 14px 18px 18px;background:'+P[ci]+';display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;cursor:pointer;position:relative;border:3px solid rgba(255,255,255,.08);box-shadow:0 3px 0 rgba(0,0,0,.5);opacity:'+(n<=0?.1:1);
    let lbl=E('span');lbl.style.cssText='position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;border:1px solid rgba(255,255,255,.15)';lbl.textContent=n;
    el.appendChild(lbl);el.appendChild(document.createTextNode('🐰'));
    if(n>0)el.addEventListener('pointerdown',e=>{e.preventDefault();tapCap(ci);});
    cr.appendChild(el);
  });
}

function updateUI(){renderUI();}

function tapCap(ci){
  if(!S.am[ci]||S.am[ci]<=0)return;
  if(S.belt.length>=BM){toast('⚠ BAND VOLL');return}
  S.am[ci]--;S.belt.push({c:ci,a:Math.max(1,S.am[ci]),p:Math.random()*.06,cd:0,ht:null});sh();
}

function tapSl(i){let s=S.sl[i];if(!s||S.belt.length>=BM)return;S.belt.push({c:s.c,a:s.a,p:Math.random()*.06,cd:0,ht:null});S.sl[i]=null;sh();}

function doUndo(){if(!S.hi.length){goMenu();return}let p=S.hi.pop();S.g=p.g;S.am=p.am;S.belt=p.belt;S.sl=p.sl;}
function doReset(){let lv=LVS[S.lv];S.g=lv.g.map(r=>[...r]);S.am={};Object.entries(lv.am).forEach(([c,v])=>S.am[c]=v);S.belt=[];S.sl=[null,null,null,null,null];S.hi=[];}

// Menu
function buildMenu(){
  let best=0;for(let i=59;i>=0;i--){if(S.cm[i]){best=i;break}}
  let g=$('lvs');g.innerHTML='';
  for(let i=0;i<30;i++){
    let ok=!!S.cm[i],lk=i>0&&!S.cm[i-1]&&!ok,nxt=(i===best+1||(i===0&&!S.cm[0]));
    let cls=ok?'d':lk?'l':nxt?'n':'p';
    let el=E('div','lv '+cls);el.textContent=i+1;
    if(!lk)el.addEventListener('pointerdown',e=>{e.preventDefault();startLv(i);drawLoop();});
    g.appendChild(el);
  }
}

function drawLoop(){if(loopId)cancelAnimationFrame(loopId);drawAll();loopId=requestAnimationFrame(loop);}

// Attach events
$('playBtn').addEventListener('pointerdown',e=>{e.preventDefault();startLv(0);drawLoop();});
$('backBtn').addEventListener('pointerdown',e=>{e.preventDefault();goMenu();});
$('undoBtn').addEventListener('pointerdown',e=>{e.preventDefault();doUndo();});
$('resetBtn').addEventListener('pointerdown',e=>{e.preventDefault();doReset();});

buildMenu();
</script>
</body>
</html>
