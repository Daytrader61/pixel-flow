<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#162447">
<link rel="manifest" href="manifest.json">
<title>Pixel Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:linear-gradient(180deg,#0a1628,#162447 50%,#0d1b3e);
  color:#fff;min-height:100vh;display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;overflow-x:hidden;touch-action:manipulation
}
main{flex:1;display:flex;flex-direction:column;max-width:460px;margin:0 auto;width:100%;padding:6px}

/* Menu */
#menuView{display:none;flex-direction:column;align-items:center;padding:20px 8px}
#menuView h2{font-size:24px;font-weight:800;margin-bottom:16px;
  background:linear-gradient(180deg,#64b5f6,#2196f3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lvl-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px;padding:8px}
.lvl-dot{
  width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2196f3,#1565c0);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;
  cursor:pointer;box-shadow:0 0 12px rgba(33,150,243,.2);transition:.1s
}
.lvl-dot:active{transform:scale(.85)}
.lvl-dot.done{background:linear-gradient(135deg,#4caf50,#2e7d32);box-shadow:0 0 12px rgba(76,175,80,.25)}
.lvl-dot.locked{background:#333;box-shadow:none;opacity:.35;pointer-events:none}
.play-b{
  padding:14px 44px;background:linear-gradient(180deg,#ffeb3b,#f9a825);color:#000;
  font-weight:900;font-size:18px;border-radius:40px;cursor:pointer;
  border:3px solid #000;box-shadow:0 4px 0 #b8860b,0 8px 18px rgba(255,235,59,.2);margin-top:12px
}
.play-b:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b}

/* Game */
#gameView{display:flex;flex-direction:column;gap:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px}
.topbar .ico{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2196f3,#1565c0);
  border:2px solid rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;box-shadow:0 2px 0 #0d47a1}.ico:active{transform:scale(.85)}
.tag{background:linear-gradient(135deg,#2196f3,#1565c0);padding:6px 16px;border-radius:16px;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(33,150,243,.2)}
.coin{display:flex;align-items:center;gap:3px;font-weight:700;color:#ffd700;font-size:13px}

/* Belt area */
.belt-wrap{position:relative;display:flex;align-items:center;justify-content:center;padding:4px}
#gameCanvas{border-radius:8px;display:block;max-width:100%}

/* Belt capacity indicator */
.cap-ind{display:flex;align-items:center;gap:6px;padding:2px 8px}
.cap-num{color:#ffd700;font-weight:700;font-size:12px}

/* Waiting slots */
.slots{display:flex;gap:8px;justify-content:center;padding:2px 0;min-height:46px}
.slot{
  width:44px;height:36px;border-radius:8px;background:#0e1628;border:2px solid #1e2e50;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.1s;
  position:relative
}
.slot.used{border-color:rgba(255,255,255,.2);background:#111d35}
.slot .bunny-inner{width:28px;height:28px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
.slot .ammo-badge{
  position:absolute;top:-7px;right:-5px;background:#1a1a2e;color:#fff;
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;border:1px solid rgba(255,255,255,.15)
}

/* Ammo supply */
.supply{display:flex;gap:12px;justify-content:center;padding:4px 0;flex-wrap:wrap;min-height:90px}
.supply-item{
  display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;transition:.1s
}
.supply-item:active{transform:scale(.88)}
.capsule{
  width:50px;height:64px;border-radius:16px 16px 20px 20px;display:flex;
  align-items:center;justify-content:center;font-size:24px;
  position:relative;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 -3px 6px rgba(0,0,0,.3);
  border:3px solid rgba(255,255,255,.15)
}
.capsule::after{
  content:'';position:absolute;top:4px;left:10px;right:10px;height:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:10px
}
.capsule .ammo-top{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  background:#1a1a2e;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;
  border:1px solid rgba(255,255,255,.2);white-space:nowrap;color:#fff
}
.capsule.spent{opacity:.18;pointer-events:none}

/* Bottom */
.btm{display:flex;gap:10px;justify-content:center;padding:6px 0}
.bigb{
  width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:18px;color:#fff;
  border:3px solid rgba(255,255,255,.2);position:relative;
  background:radial-gradient(circle at 30% 25%,#64b5f6,#1565c0);
  box-shadow:0 3px 0 #0d47a1,0 0 16px rgba(33,150,243,.2);transition:.1s
}
.bigb:active{transform:translateY(2px);box-shadow:0 1px 0 #0d47a1}
.bigb::after{content:'';position:absolute;top:3px;left:8px;right:8px;height:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);border-radius:50%}

/* Win */
.win-o{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;animation:fi .3s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.win-c{background:linear-gradient(180deg,#1e3a5f,#0d1b3e);border-radius:20px;padding:22px;text-align:center;max-width:270px;width:90%;border:3px solid #2a5080;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.win-c h3{font-size:20px;margin:4px 0}.win-c .em{font-size:40px}.win-c .rwd{color:#ffd700;font-weight:700}
.win-c .acts{display:flex;gap:8px;justify-content:center;margin-top:12px}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:9px 18px;background:rgba(30,58,95,.95);border-radius:16px;font-size:12px;font-weight:700;z-index:300;pointer-events:none;opacity:0;transition:.25s;border:1px solid #2a5080}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="toast"></div>
<main>
  <div id="menuView"><h2>PIXEL FLOW</h2><div class="lvl-grid" id="levelGrid"></div><button class="play-b" onclick="startLatest()">▶ SPIELEN</button></div>
  <div id="gameView">
    <div class="topbar">
      <button class="ico" onclick="goMenu()">◀</button>
      <span class="tag" id="lvlTag">Level 1</span>
      <div class="coin"><span>🪙</span><span id="coinNum">0</span></div>
    </div>
    <div class="belt-wrap"><canvas id="gameCanvas"></canvas></div>
    <div class="cap-ind"><span class="cap-num" id="capNum">0/5</span><span style="font-size:10px;color:#7fa0c0">Förderband</span></div>
    <div class="slots" id="slotsRow"></div>
    <div class="supply" id="supplyRow"></div>
    <div class="btm">
      <button class="bigb" onclick="resetLvl()">🔄</button>
      <button class="bigb" onclick="doUndo()">↩</button>
    </div>
  </div>
</main>

<script>
// ==================== PIXEL FLOW - RING CONVEYOR BELT ====================
const PAL = ['#e91e63','#4caf50','#2196f3','#ff9800','#9c27b0','#ffeb3b','#00bcd4','#ff5252'];
const EMPTY = '#0a1628';
const BELT_MAX = 5;

let LV = [];
(function gen(){
  for(let i=0;i<100;i++){
    let sz = i<8?5:i<18?6:i<35?7:i<60?8:i<80?9:10;
    let nc = i<6?2:i<15?3:i<30?4:i<55?5:6;
    let p = Array.from({length:sz},()=>Array(sz).fill(-1));
    let clrs = shuf([...Array(PAL.length).keys()]).slice(0,nc);
    clrs.forEach(ci=>{
      let blob = 4+Math.floor(Math.random()*(sz*sz/nc));
      let r=rand(sz),c=rand(sz);
      for(let b=0;b<blob;b++){
        if(p[r][c]===-1)p[r][c]=ci;
        let d=[[0,1],[0,-1],[1,0],[-1,0]][rand(4)];
        let nr=r+d[0],nc=c+d[1];if(nr>=0&&nr<sz&&nc>=0&&nc<sz){r=nr;c=nc}
      }
    });
    let supply=[];clrs.forEach(ci=>{let need=0;p.forEach(r=>r.forEach(v=>{if(v===ci)need++}));supply.push({c:ci,ammo:need+1+rand(4)});});
    LV.push({sz,p,supply,clrs});
  }
  function shuf(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
  function rand(n){return Math.floor(Math.random()*n)}
})();

let S = {lv:0,grid:[],supply:[],belt:[],slots:[null,null,null,null,null],coins:0,com:{},hist:[],CELL:0,beltClock:0};

function ld(){
  try{let c=localStorage.getItem('pf7c');if(c)S.com=JSON.parse(c);let n=localStorage.getItem('pf7n');if(n)S.coins=parseInt(n)||0}catch(e){}
}
function sv(){try{localStorage.setItem('pf7c',JSON.stringify(S.com));localStorage.setItem('pf7n',''+S.coins)}catch(e){}}

function startLv(n){
  S.lv=n;S.hist=[];let l=LV[n],sz=l.sz;
  S.CELL=Math.floor((Math.min(window.innerWidth-60,370))/sz);
  S.grid=l.p.map(r=>[...r]);S.belt=[];S.slots=[null,null,null,null,null];S.beltClock=0;
  S.supply=l.supply.map(s=>({c:s.c,ammo:s.ammo}));
  let cv=document.getElementById('gameCanvas');
  cv.width=sz*S.CELL+100;cv.height=sz*S.CELL+100;
  document.getElementById('menuView').style.display='none';
  document.getElementById('gameView').style.display='flex';
  render();
  if(window._pfLoop)cancelAnimationFrame(window._pfLoop);
  gameLoop();
}
function goMenu(){
  cancelAnimationFrame(window._pfLoop);window._pfLoop=null;
  document.getElementById('menuView').style.display='flex';document.getElementById('gameView').style.display='none';buildMenu();
}
function startLatest(){
  let l=0;for(let i=LV.length-1;i>=0;i--){if(S.com[i]){l=Math.min(i+1,LV.length-1);break}}
  startLv(l);
}

// Game loop
function gameLoop(){
  let l=LV[S.lv],sz=l.sz;
  S.beltClock+=.008;if(S.beltClock>1)S.beltClock-=1;
  
  // Each belt bunny auto-shoots
  S.belt.forEach(b=>{
    b.shotCD-=16;if(b.shotCD<0)b.shotCD=0;
    if(b.ammo>0&&b.shotCD<=0){
      let best=null,bestAngle=Infinity;
      let bunAngle=b.pos*Math.PI*2+S.beltClock*Math.PI*2;
      for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(S.grid[r][c]===b.color){
        let ta=Math.atan2(r-sz/2+.5,c-sz/2+.5);
        let diff=Math.abs(((bunAngle-ta+Math.PI*3)%(Math.PI*2))-Math.PI);
        if(diff<bestAngle){bestAngle=diff;best={r,c};}
      }
      if(best&&bestAngle<.6){
        S.grid[best.r][best.c]=-1;b.ammo--;b.shotCD=300;b.hitR=best.r;b.hitC=best.c;
      }
    }
  });
  
  // Remove empty bunnies, send remaining to slots
  let toKill=[],toSlot=[];
  for(let i=S.belt.length-1;i>=0;i--){
    let b=S.belt[i];
    if(b.ammo<=0){toKill.push(i);continue}
    if(b.pos>.92){let si=S.slots.indexOf(null);if(si!==-1)toSlot.push({bi:i,si});}
  }
  toSlot.forEach(({bi,si})=>{let b=S.belt.splice(bi,1)[0];if(b)S.slots[si]={color:b.color,ammo:b.ammo};});
  toKill.forEach(i=>S.belt.splice(i,1));
  
  draw();render();
  if(checkWin())return;
  window._pfLoop=requestAnimationFrame(gameLoop);
}

function draw(){
  let l=LV[S.lv],sz=l.sz,cv=document.getElementById('gameCanvas');
  let ctx=cv.getContext('2d'),C=S.CELL,ox=(cv.width-sz*C)/2,oy=(cv.height-sz*C)/2;
  ctx.clearRect(0,0,cv.width,cv.height);
  
  let cx=ox+sz*C/2,cy=oy+sz*C/2,beltR=sz*C/2+24;
  
  // Belt ring background
  ctx.strokeStyle='rgba(100,160,255,.15)';ctx.lineWidth=14;
  ctx.beginPath();ctx.arc(cx,cy,beltR,0,Math.PI*2);ctx.stroke();
  // Belt arrows
  for(let a=0;a<8;a++){
    let ang=S.beltClock*Math.PI*2+a*Math.PI/4;
    let ax=cx+Math.cos(ang)*beltR,ay=cy+Math.sin(ang)*beltR;
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText('▶',ax+Math.cos(ang)*6,ay+Math.sin(ang)*6+3);
  }
  
  // Grid
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){
    let x=ox+c*C,y=oy+r*C,v=S.grid[r][c];
    if(v>=0){
      ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(x,y,C,C);
      ctx.fillStyle=PAL[v];ctx.fillRect(x+1,y+1,C-2,C-2);
      ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+1,y+1,C*.35,C*.35);
    }
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=.5;ctx.strokeRect(x,y,C,C);
  }
  
  // Bunnies on belt
  S.belt.forEach(b=>{
    let ang=b.pos*Math.PI*2+S.beltClock*Math.PI*2;
    let bx=cx+Math.cos(ang)*beltR,by=cy+Math.sin(ang)*beltR;
    drawBun(ctx,bx,by,PAL[b.color],b.ammo,ang);
    // Shoot line if hit recently
    if(b.hitR!==undefined&&b.shotCD>200){
      let tx=ox+b.hitC*C+C/2,ty=oy+b.hitR*C+C/2;
      ctx.strokeStyle=PAL[b.color]+'60';ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillRect(tx-2,ty-2,4,4);
    }
  });
  
  // Loader mechanism (left side)
  ctx.fillStyle='#1e2e50';ctx.fillRect(ox-16,cy-16,12,32);ctx.fillRect(ox-14,cy-12,10,24);
}

function drawBun(ctx,x,y,c,ammo,ang){
  // Body
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();
  // Gloss
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(x-1,y-2,4,0,Math.PI*2);ctx.fill();
  // Ears
  ctx.fillStyle=c;ctx.fillRect(x-3,y-12,3,9);ctx.fillRect(x+1,y-12,3,9);
  ctx.fillStyle='#ffb6c1';ctx.fillRect(x-2,y-10,1.5,5);ctx.fillRect(x+2,y-10,1.5,5);
  // Eyes
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-2,y-1,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+3,y-1,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x-1.5,y-1,1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+3.5,y-1,1,0,Math.PI*2);ctx.fill();
  // Nose
  ctx.fillStyle='#ff69b4';ctx.beginPath();ctx.arc(x,y+2,1.5,0,Math.PI*2);ctx.fill();
  
  // Ammo bubble above
  let bx=x+Math.cos(ang)*4,by=y-14+Math.sin(ang)*4;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(bx-10,by-8,20,14,6);ctx.fill();
  ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText(ammo,bx,by+2.5);
}

// Interactions
function tapSupply(i){
  let s=S.supply[i];if(!s||s.ammo<=0)return;
  if(S.belt.length>=BELT_MAX){tst('🛑 Förderband voll! ('+BELT_MAX+'/'+BELT_MAX+')');return}
  s.ammo--;S.belt.push({color:s.c,ammo:s.ammo===0?1:s.ammo,pos:Math.random(),shotCD:0});
  if(s.ammo<=0)S.supply.splice(i,1);
  pushH();render();
}
function tapSlot(i){
  let s=S.slots[i];if(!s)return;
  if(S.belt.length>=BELT_MAX){tst('🛑 Förderband voll!');return}
  S.belt.push({color:s.color,ammo:s.ammo,pos:Math.random(),shotCD:0});S.slots[i]=null;
  pushH();render();
}

// Tap canvas = quick-send from supply or slots
document.getElementById('gameCanvas').addEventListener('click',function(e){
  let rect=this.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let cv=this,scaleX=cv.width/rect.width,scaleY=cv.height/rect.height;
  mx*=scaleX;my*=scaleY;
  let l=LV[S.lv],sz=l.sz,C=S.CELL,ox=(cv.width-sz*C)/2,oy=(cv.height-sz*C)/2;
  let cx=ox+sz*C/2,cy=oy+sz*C/2,beltR=sz*C/2+24;
  
  // Check if tapped a bunny on belt
  for(let i=S.belt.length-1;i>=0;i--){
    let b=S.belt[i];
    let ang=b.pos*Math.PI*2+S.beltClock*Math.PI*2;
    let bx=cx+Math.cos(ang)*beltR,by=cy+Math.sin(ang)*beltR;
    if(Math.hypot(mx-bx,my-by)<18){
      // Tap bunny → send to slot if available
      let si=S.slots.indexOf(null);
      if(si!==-1){let b2=S.belt.splice(i,1)[0];S.slots[si]={color:b2.color,ammo:b2.ammo};pushH();render();}
      else tst('Kein Platz in Slots!');
      return;
    }
  }
  // Default: send from supply
  let avail=S.supply.findIndex(s=>s.ammo>0);
  if(avail!==-1){tapSupply(avail);return}
  let sl=S.slots.findIndex(s=>s!==null);
  if(sl!==-1){tapSlot(sl);return}
});

function pushH(){
  S.hist.push({g:S.grid.map(r=>[...r]),belt:JSON.parse(JSON.stringify(S.belt)),slots:[...S.slots],supply:JSON.parse(JSON.stringify(S.supply))});
  if(S.hist.length>20)S.hist.shift();
}
function doUndo(){if(!S.hist.length){tst('Nichts rückgängig');return}let p=S.hist.pop();S.grid=p.g;S.belt=p.belt;S.slots=p.slots;S.supply=p.supply;render();}
function resetLvl(){S.hist=[];let l=LV[S.lv];S.grid=l.p.map(r=>[...r]);S.belt=[];S.slots=[null,null,null,null,null];S.supply=l.supply.map(s=>({c:s.c,ammo:s.ammo}));render();tst('🔄 Zurückgesetzt');}

function checkWin(){
  let sz=LV[S.lv].sz;for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(S.grid[r][c]>=0)return false;
  S.com[S.lv]=true;S.coins+=10;sv();cancelAnimationFrame(window._pfLoop);
  let pop=document.createElement('div');pop.className='win-o';
  pop.innerHTML=`<div class="win-c"><div class="em">🎉</div><h3>Level ${S.lv+1}!</h3><div class="rwd">+10 🪙</div>
    <div class="acts"><button class="bigb" style="width:auto;padding:0 16px;border-radius:16px;font-size:11px" onclick="nxtLv(this)">▶</button>
    <button class="bigb" style="width:auto;padding:0 12px;border-radius:16px;font-size:11px;background:radial-gradient(circle at 30% 25%,#7b68ee,#3d1a60)" onclick="goMenu();this.closest('.win-o')?.remove()">🏠</button></div></div>`;
  document.body.appendChild(pop);draw();return true;
}
function nxtLv(el){el.closest('.win-o')?.remove();let n=S.lv+1;if(n>=LV.length){goMenu();tst('🏆');return}S.com[n]=true;sv();startLv(n);}

function render(){
  document.getElementById('lvlTag').textContent='Level '+(S.lv+1);
  document.getElementById('coinNum').textContent=S.coins;
  document.getElementById('capNum').textContent=S.belt.length+'/'+BELT_MAX;
  
  // Slots
  document.getElementById('slotsRow').innerHTML=S.slots.map((s,i)=>{
    if(s)return`<div class="slot used" onclick="tapSlot(${i})"><div class="bunny-inner" style="background:${PAL[s.color]}">🐰</div><div class="ammo-badge">${s.ammo}</div></div>`;
    return`<div class="slot" onclick="tapSlot(${i})" style="color:#1e2e50;font-size:16px">+</div>`;
  }).join('');
  
  // Supply
  document.getElementById('supplyRow').innerHTML=S.supply.map((s,i)=>`<div class="supply-item" onclick="tapSupply(${i})"><div class="capsule ${s.ammo<=0?'spent':''}" style="background:${PAL[s.c]}"><div class="ammo-top">${s.ammo}</div>🐰</div></div>`).join('');
}

function buildMenu(){
  let g=document.getElementById('levelGrid');g.innerHTML='';
  for(let i=0;i<Math.min(50,LV.length);i++){
    let cls=S.com[i]?'done':(i>0&&!S.com[i-1]?'locked':'');
    g.innerHTML+=`<div class="lvl-dot ${cls}" onclick="${cls.includes('locked')?'':"startLv("+i+")"}">${i+1}</div>`;
  }
}

function tst(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1300)}
ld();buildMenu();
document.getElementById('menuView').style.display='flex';document.getElementById('gameView').style.display='none';
</script>
